[workspace]
members = [
    "credential-provider",
    "otel-helper",
    "shared"
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Claude Code Team"]

[workspace.dependencies]
# HTTP & OAuth
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"

# JWT & Crypto
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# AWS SDK
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-cognitoidentity = "1.84"
aws-sdk-sts = "1.84"

# Storage
keyring = "3.2"

# CLI & Serialization
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"
simplelog = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# URL handling
url = "2.5"
urlencoding = "2.1"

# Utilities
hex = "0.4"
dirs = "5.0"
webbrowser = "1.0"
socket2 = "0.5"
libc = "0.2"
